<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parina ❤️</title>
<style>
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Card style */
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Floating Hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 6s linear infinite;
  color: red;
}
@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-100vh); opacity: 0; }
}

/* Typing Text */
.typing-text {
  font-size: 24px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  border-right: .15em solid orange;
  width: 0;
  animation: typing 3s steps(30, end) forwards, blink 0.75s step-end infinite;
}
@keyframes typing {
  from { width: 0; }
  to { width: 100%; }
}
@keyframes blink {
  50% { border-color: transparent; }
}

/* Heartbeat Button */
.heart-btn {
  font-size: 40px;
  color: red;
  background: none;
  border: none;
  cursor: pointer;
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* Falling Roses */
.rose {
  position: fixed;
  top: -20px;
  font-size: 24px;
  animation: fall 5s linear infinite;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(100vh) rotate(360deg); }
}
</style>
</head>
<body>

<div class="card">
  <div class="typing-text">Parina, Will You Be My Valentine?</div>
  <p>Parina, you make my world brighter every single day ✨</p>
  <button id="yes" onclick="sayYes()">Yes 💕</button>
  <button id="no" onmouseover="moveNo()">No 🙈</button>
  <button class="heart-btn">❤️</button>
</div>

<script>
/* Floating hearts */
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 400);

/* Falling Roses */
setInterval(() => {
  const rose = document.createElement("div");
  rose.className = "rose";
  rose.innerHTML = "🌹";
  rose.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(rose);
  setTimeout(() => rose.remove(), 5000);
}, 600);

/* NO button moves away */
function moveNo() {
  const noBtn = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* YES button shows celebration */
function sayYes() {
  document.body.innerHTML = `
    <div style="text-align:center;color:white;">
      <h1>Yaaay! 💘🎉</h1>
      <p>Happy Valentine’s Day, Parina ❤️</p>
    </div>`;
}

/* Confetti on heart button click */
document.querySelector(".heart-btn").addEventListener("click", () => {
  for (let i = 0; i < 100; i++) {
    const confetti = document.createElement("div");
    confetti.style.position = "fixed";
    confetti.style.width = "10px";
    confetti.style.height = "10px";
    confetti.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.top = "-10px";
    confetti.style.opacity = 1;
    confetti.style.zIndex = 9999;
    document.body.appendChild(confetti);

    let top = -10;
    let left = parseFloat(confetti.style.left);
    const fall = setInterval(() => {
      top += Math.random() * 5;
      left += Math.random() * 2 - 1;
      confetti.style.top = top + "px";
      confetti.style.left = left + "px";
      if (top > window.innerHeight) {
        confetti.remove();
        clearInterval(fall);
      }
    }, 20);
  }
});
</script>
</body>
</html>
