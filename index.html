<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parina ❤️</title>

<style>
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    color: #ff4d6d;
}

button {
    font-size: 16px;
    padding: 10px 22px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin: 10px;
}

#yes {
    background: #ff4d6d;
    color: white;
}

#no {
    background: #ccc;
    position: absolute;
}
</style>
</head>

<body>

<div class="card">
<h1>💖 Parina, Will You Be My Valentine? 💖</h1>
<p>Parina, you make my world brighter every single day ✨</p>

<button id="yes" onclick="sayYes()">Yes 💕</button>
<button id="no" onmouseover="moveNo()">No 🙈</button>
</div>

<script>
function sayYes() {
    document.body.innerHTML = `
    <div style="text-align:center;color:white;">
        <h1>Yaaay! 💘🎉</h1>
        <p>Happy Valentine’s Day, Parina ❤️</p>
    </div>`;
}

function moveNo() {
    const noBtn = document.getElementById("no");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}
</script>

</body>
</html>
